[package]
name = "repertoire"
description = "répertoire: a live index of disk usage and file names (daemon and CLI)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "repertoired"
path = "src/bin/repertoired.rs"

[[bin]]
name = "repertoire"
path = "src/bin/repertoire.rs"

[dependencies]
libc.workspace = true
rayon.workspace = true
repertoire-core.workspace = true
repertoire-proto.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
repertoire-linux.workspace = true
