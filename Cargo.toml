[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Sigma-studios/repertoire"

[workspace.dependencies]
libc = "0.2"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
repertoire-proto = { path = "crates/repertoire-proto" }
repertoire-core = { path = "crates/repertoire-core" }
repertoire-linux = { path = "crates/repertoire-linux" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
